version: '3.8'

services:
  scambaiter-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scambaiter-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - DIRECT_URL=${DIRECT_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-https://fanivhbjwfaiezpsawpa.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - SUPABASE_REGION=${SUPABASE_REGION:-us-west-2}
      - ADMIN_USER=${ADMIN_USER:-cookiescambait@gmail.com}
      - ADMIN_PASS=${ADMIN_PASS:-sbAdmin2026!#}
      - JWT_SECRET=${JWT_SECRET:-super-secret-dokploy-scambaiter-key-2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APP_URL=${APP_URL:-https://your-domain.com}
      - DATA_DIR=/app/data
    volumes:
      # Persistent named volume - survives restarts and updates
      - scambaiter_db_data:/app/data
      # Alternatively, to use a host bind mount in Dokploy, replace the line above with:
      # - ./data:/app/data
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.scambaiter-http.rule=Host(`${DOMAIN:-scambaiter.yourdomain.com}`)"
      - "traefik.http.routers.scambaiter-http.entrypoints=web"
      - "traefik.http.routers.scambaiter-http.service=scambaiter"
      - "traefik.http.routers.scambaiter.rule=Host(`${DOMAIN:-scambaiter.yourdomain.com}`)"
      - "traefik.http.routers.scambaiter.entrypoints=websecure"
      - "traefik.http.routers.scambaiter.tls=true"
      - "traefik.http.routers.scambaiter.tls.certresolver=letsencrypt"
      - "traefik.http.routers.scambaiter.service=scambaiter"
      - "traefik.http.services.scambaiter.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.cloudflare-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.cloudflare-headers.headers.sslredirect=false"
      - "traefik.http.routers.scambaiter.middlewares=cloudflare-headers"
      - "traefik.http.routers.scambaiter-http.middlewares=cloudflare-headers"

volumes:
  scambaiter_db_data:
    name: scambaiter_db_data

networks:
  dokploy-network:
    name: dokploy-network
    external: true
